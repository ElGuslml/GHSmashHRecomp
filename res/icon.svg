<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <!-- The GHSmashHRecomp icon: a guitar pick with a vinyl record on a riveted steel medallion. The pick, the record
       and the colors are GH Smash Hits Launcher's art's (launcher/art/background.svg: its gold pick, its vinyl record,
       its chrome, its red stage and rays), drawn for this project (no art from the game); GHMetalRecomp's,
       GHVanHRecomp's, GH5Recomp's and GHWoRRecomp's icon with its own pick. res/make_icon.mjs builds res/icon.ico from
       this file (40 px and up) and icon_small.svg (16-32 px). -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.35" stop-color="#9aa1a9"/>
      <stop offset="0.55" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#5d636b"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#5c1214"/>
      <stop offset="0.6" stop-color="#2e0809"/>
      <stop offset="1" stop-color="#120304"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd866"/>
      <stop offset="0.5" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#c47a10"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5d636b"/>
    </radialGradient>
    <clipPath id="inside">
      <circle cx="128" cy="128" r="88"/>
    </clipPath>
    <circle id="stud" r="4.6" fill="url(#rivet)" stroke="#120c0a" stroke-width="1.5"/>
    <path id="ray" d="M 128,128 L 117,20 L 139,20 Z"/>
    <path id="sparkle" d="M 0,-9 L 2,-2 L 9,0 L 2,2 L 0,9 L -2,2 L -9,0 L -2,-2 Z" fill="#f3ebda"/>
    <path id="pick" d="M 128,204 C 100,178 66,140 66,104 C 66,74 98,58 128,58 C 158,58 190,74 190,104
                       C 190,140 156,178 128,204 Z"/>
  </defs>

  <!-- Medallion: a chrome rim with eight rivets, the stage dark red in the middle (the launcher art's chrome and
       ground). -->
  <circle cx="128" cy="128" r="106" fill="url(#steel)" stroke="#120c0a" stroke-width="4"/>
  <circle cx="128" cy="128" r="101" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <use xlink:href="#stud" transform="translate(218.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 90.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(218.5 90.5)"/>
  <circle cx="128" cy="128" r="90" fill="url(#stage)" stroke="#120c0a" stroke-width="4"/>

  <!-- Stage light: the art's red rays from the middle and the amber glow behind the pick. -->
  <g clip-path="url(#inside)">
    <g fill="#ff4a3a" fill-opacity="0.16">
      <use xlink:href="#ray"/>
      <use xlink:href="#ray" transform="rotate(30 128 128)"/>
      <use xlink:href="#ray" transform="rotate(60 128 128)"/>
      <use xlink:href="#ray" transform="rotate(90 128 128)"/>
      <use xlink:href="#ray" transform="rotate(120 128 128)"/>
      <use xlink:href="#ray" transform="rotate(150 128 128)"/>
      <use xlink:href="#ray" transform="rotate(180 128 128)"/>
      <use xlink:href="#ray" transform="rotate(210 128 128)"/>
      <use xlink:href="#ray" transform="rotate(240 128 128)"/>
      <use xlink:href="#ray" transform="rotate(270 128 128)"/>
      <use xlink:href="#ray" transform="rotate(300 128 128)"/>
      <use xlink:href="#ray" transform="rotate(330 128 128)"/>
    </g>
    <circle cx="128" cy="130" r="88" fill="url(#glow)"/>
  </g>

  <!-- The pick: a cream border around it (the art's #F3EBDA), then the amber pick (the launcher's accent between the
       art's sun and its gold pick's shade), its shade and highlight. -->
  <use xlink:href="#pick" fill="none" stroke="#f3ebda" stroke-width="16" stroke-linejoin="round"/>
  <use xlink:href="#pick" fill="url(#amber)"/>
  <g transform="translate(128 128) scale(1.08)">
    <path d="M0 70 C24 46 44 20 52 -6 C40 22 22 44 0 60 Z" fill="#9c5a0a" opacity="0.45"/>
    <path d="M0 58 C-26 32 -48 4 -48 -20 C-48 -42 -26 -52 0 -52" fill="none" stroke="#fff3c4" stroke-width="3"
          stroke-linecap="round" opacity="0.7"/>
  </g>
  <use xlink:href="#pick" fill="none" stroke="#120c0a" stroke-width="6" stroke-linejoin="round"/>

  <!-- The art's vinyl record, its grooves, shine and red label (launcher/art/background.svg), scaled 0.62. -->
  <g transform="translate(128 116) scale(0.62)">
    <circle r="74" fill="#141316" stroke="#120c0a" stroke-width="7"/>
    <g fill="none" stroke-width="2.2">
      <circle r="66" stroke="#2a2830"/>
      <circle r="60" stroke="#1a191d"/>
      <circle r="54" stroke="#2a2830"/>
      <circle r="48" stroke="#1a191d"/>
      <circle r="42" stroke="#2a2830"/>
      <circle r="36" stroke="#1a191d"/>
      <circle r="30" stroke="#2a2830"/>
    </g>
    <path d="M-52 -42 A67 67 0 0 1 8 -67" fill="none" stroke="#7a7880" stroke-width="7" stroke-linecap="round"
          opacity="0.85"/>
    <path d="M50 44 A67 67 0 0 1 -6 67" fill="none" stroke="#55535b" stroke-width="6" stroke-linecap="round"
          opacity="0.75"/>
    <circle r="25" fill="#d62c2c" stroke="#120c0a" stroke-width="4"/>
    <circle r="18.5" fill="none" stroke="#f5a623" stroke-width="3"/>
    <path d="M-12 -8 H12 M-9 -2 H9" stroke="#f3ebda" stroke-width="2.6" stroke-linecap="round"/>
    <circle r="5" fill="#0b0a0c"/>
  </g>

  <!-- Sparkles -->
  <use xlink:href="#sparkle" transform="translate(70 70)"/>
  <use xlink:href="#sparkle" transform="translate(190 178) scale(0.75)"/>
</svg>
